name: Android APK

on:
  push:
    branches: [main]
    paths: ["android-src.tar.gz.enc", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AIDJ_SRC_KEY: ${{ secrets.AIDJ_SRC_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Исходники (зашифрованы, ключ — в секретах репозитория)
        run: |
          if [ -z "$AIDJ_SRC_KEY" ]; then echo "::error::Нет секрета AIDJ_SRC_KEY"; exit 1; fi
          mkdir -p src
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AIDJ_SRC_KEY \
            -in android-src.tar.gz.enc | tar -xz -C src
          ls src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: QuickJS под телефон (arm64)
        run: |
          git clone --depth 1 --branch v0.10.1 https://github.com/quickjs-ng/quickjs.git qjs \
            || git clone --depth 1 https://github.com/quickjs-ng/quickjs.git qjs
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK: $NDK"
          cmake -S qjs -B qjs/build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26
          cmake --build qjs/build --target qjs -j 4
          mkdir -p src/app/src/main/jniLibs/arm64-v8a
          cp qjs/build/qjs src/app/src/main/jniLibs/arm64-v8a/libqjs.so
          file src/app/src/main/jniLibs/arm64-v8a/libqjs.so

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Сборка APK
        run: |
          set -a; . src/signing/keystore.env; set +a
          export AIDJ_KEYSTORE="$PWD/src/signing/aidj.jks"
          N=${{ github.run_number }}
          cd src
          gradle :app:assembleRelease --stacktrace -PaidjVersion=0.1.$N -PaidjCode=$N
          mkdir -p ../out
          cp app/build/outputs/apk/release/app-release.apk ../out/AI-DJ-android-0.1.$N.apk
          ls -la ../out

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk

      - name: Релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=${{ github.run_number }}
          gh release create "android-v0.1.$N" out/*.apk --repo "${{ github.repository }}" \
            --title "AI DJ для Android 0.1.$N" --notes "Тестовая сборка для Android." --prerelease
